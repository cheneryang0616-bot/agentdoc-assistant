name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    env:
      # 全离线：不依赖任何 API Key，CI 也能完整跑通
      AGENTDOC_EMBEDDER: hash
      AGENTDOC_LLM_PROVIDER: offline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (21 assertions)
        run: python tests/test_core.py

      - name: OpenAI-compatible backend integration test (local mock)
        run: python tests/test_openai_backend.py

      - name: MCP integration test (stdio)
        run: python tests/test_mcp.py

      - name: Experiments (fully offline, no API key)
        run: |
          python experiments/exp1_agent_loop.py
          python experiments/exp2_context_compression.py
          python experiments/exp3_memory_lifecycle.py
          python experiments/exp4_finetune_embedding.py
          python experiments/exp5_embedder_compare.py
          python experiments/summarize.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: |
            results/*.json
            results/RESULTS.md
          if-no-files-found: warn
